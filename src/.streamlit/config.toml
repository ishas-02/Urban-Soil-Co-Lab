[theme]
# Set the default theme for all users ("light" or "dark")
base="dark"

# Primary accent color (This will change your buttons and highlights)
# e.g., A professional soil-lab green
primaryColor="#2ecc71"

# Background colors (Optional: tweak these if you want a custom dark mode)
backgroundColor="#0E1117"
secondaryBackgroundColor="#262730"

# Text color
textColor="#FAFAFA"

# Font choice
font="sans serif"